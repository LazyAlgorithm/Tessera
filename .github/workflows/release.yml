# Builds the Tessera editor for Linux and Windows with tools/package_engine.py (the same packages the editor's
# File > Build makes with Build: Editor), zips each, and puts them on a GitHub release.
#
# When it runs:
#   - a version tag is pushed (git tag v0.5 && git push origin v0.5): a release named after the tag;
#   - a push to the `release` branch: a pre-release named after the date and commit;
#   - by hand, from the Actions tab (Run workflow): the same, or the zips only as downloadable artifacts.
#
# Linux and Windows build at the same time, each on its own system: Linux on Ubuntu 22.04 (glibc 2.35, so it runs on
# most current distributions), Windows on a Windows machine with Microsoft's compiler tools. The third-party native
# libraries are kept in the Actions cache (.github/scripts/native-deps.sh) and only built again when third_party/ or
# the native CMake setup changes; the Beef compilers are cached too. A third job puts both zips on the release.
name: Engine release

on:
  push:
    tags: ['v*']
    branches: [release]
  workflow_dispatch:
    inputs:
      publish:
        description: Make a pre-release (otherwise the zips are only attached to the run)
        type: boolean
        default: true

permissions:
  contents: write

env:
  # Beef's compiler for Linux, built from source. Windows uses Beef's own Windows release.
  BEEF_COMMIT: b62833e327d6b08f3566b31102c57646de6916b0
  LLVM_VERSION: '22'
  NATIVE_TARGETS: tessera_native bgfx bimg bimg_decode bx SDL3-static joltc Jolt enet shaderc

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        # A failing step repeats the end of its output on the run's page (.github/scripts/step.sh).
        shell: bash tessera/.github/scripts/step.sh {0}
    steps:
      - name: Get Tessera
        uses: actions/checkout@v4
        with:
          path: tessera

      # The build scripts need Python 3.11 or later (tomllib); Ubuntu 22.04 has 3.10.
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake zip xz-utils curl \
            libx11-dev libxext-dev libxi-dev libxfixes-dev libxcursor-dev libxrandr-dev libxss-dev libxrender-dev \
            libgl-dev libegl-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev \
            libffi-dev zlib1g-dev libzstd-dev libxml2-dev libedit-dev
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y "llvm-$LLVM_VERSION-dev" "clang-$LLVM_VERSION" "lld-$LLVM_VERSION"
          for tool in clang clang++ llvm-ar llvm-config; do
            sudo ln -sf "/usr/lib/llvm-$LLVM_VERSION/bin/$tool" "/usr/local/bin/$tool"
          done

      # Restored and saved as separate steps, so that what a run builds is kept even if a later step fails.
      - name: Cache the Beef compiler
        id: beef-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/beef
          key: beef-${{ env.BEEF_COMMIT }}-llvm${{ env.LLVM_VERSION }}-jammy

      - name: Build the Beef compiler
        if: steps.beef-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/beefytech/Beef ~/beef
          git -C ~/beef checkout "$BEEF_COMMIT"
          cd ~/beef/bin && ./build.sh

      - name: Keep the Beef compiler
        if: steps.beef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/beef
          key: beef-${{ env.BEEF_COMMIT }}-llvm${{ env.LLVM_VERSION }}-jammy

      - name: Native library cache key
        id: native-key
        run: echo "key=$(tessera/.github/scripts/native-deps.sh key linux)" >> "$GITHUB_OUTPUT"

      - name: Cache the native libraries
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: tessera/build/native
          key: ${{ steps.native-key.outputs.key }}

      - name: Native libraries
        run: |
          [ "${{ steps.native-cache.outputs.cache-hit }}" = "true" ] && tessera/.github/scripts/native-deps.sh settle
          cd tessera
          python3 tools/patch_textedit.py
          [ -f build/native/CMakeCache.txt ] || cmake -S native -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native -j "$(nproc)" --target $NATIVE_TARGETS

      - name: Keep the native libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tessera/build/native
          key: ${{ steps.native-key.outputs.key }}

      - name: Build and package
        run: |
          export BEEFBUILD="$HOME/beef/IDE/dist/BeefBuild"
          cd tessera
          python3 tools/package_engine.py --platform linux --folder ../out/Tessera-Linux
          cd ../out && zip -qr9 Tessera-Linux.zip Tessera-Linux

      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: Tessera-Linux
          path: out/Tessera-Linux.zip

  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      # The build scripts read and write UTF-8 text, whatever the machine's own code page.
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash tessera/.github/scripts/step.sh {0}
    steps:
      # Scripts are run by bash: keep their line endings as they are in the repository.
      - name: Line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Get Tessera
        uses: actions/checkout@v4
        with:
          path: tessera

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Microsoft's compiler environment (the C runtime and Windows SDK), used by clang-cl and Beef's linker.
      - name: Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build tools
        run: |
          python -m pip install --quiet ninja
          ninja --version
          clang-cl --version | head -1

      - name: Cache the Beef compiler
        id: beef-cache
        uses: actions/cache@v4
        with:
          path: beef-win
          key: beef-win-v1

      - name: Get the Beef compiler
        if: steps.beef-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL -o BeefSetup.exe http://nightly.beeflang.org/BeefSetup.exe
          mkdir -p beef-win && (cd beef-win && 7z x -y ../BeefSetup.exe > /dev/null)
          rm -f BeefSetup.exe

      - name: Native library cache key
        id: native-key
        run: echo "key=$(tessera/.github/scripts/native-deps.sh key windows)" >> "$GITHUB_OUTPUT"

      - name: Cache the native libraries
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: tessera/build/native-win
          key: ${{ steps.native-key.outputs.key }}

      - name: Native libraries
        run: |
          [ "${{ steps.native-cache.outputs.cache-hit }}" = "true" ] && tessera/.github/scripts/native-deps.sh settle
          cd tessera
          python tools/patch_textedit.py
          # Beef links Windows programs against the static C runtime; so must everything linked into them.
          [ -f build/native-win/CMakeCache.txt ] || cmake -S native -B build/native-win -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_POLICY_DEFAULT_CMP0091=NEW
          cmake --build build/native-win -j "$NUMBER_OF_PROCESSORS" --target $NATIVE_TARGETS

      - name: Keep the native libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tessera/build/native-win
          key: ${{ steps.native-key.outputs.key }}

      - name: Build and package
        run: |
          # Beef finds its libraries beside itself.
          printf 'Version = 1\nUnversionedLibDirs = ["../BeefLibs"]\n' > beef-win/bin/BeefConfig.toml
          export BEEFBUILD="$(cygpath -w "$PWD/beef-win/bin/BeefBuild.exe")"
          cd tessera
          python tools/package_engine.py --platform windows --folder ../out/Tessera-Windows
          cd ../out && 7z a -tzip -mx=9 Tessera-Windows.zip Tessera-Windows > /dev/null

      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: Tessera-Windows
          path: out/Tessera-Windows.zip

  release:
    needs: [linux, windows]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-22.04
    steps:
      - name: Get the zips
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          short="${GITHUB_SHA:0:7}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"; title="Tessera ${GITHUB_REF_NAME}"; pre=""
          else
            tag="build-$(date -u +%Y%m%d)-$short"; title="Tessera build $(date -u +%Y-%m-%d) ($short)"; pre="--prerelease"
          fi
          notes="Built from Tessera $short ($GITHUB_REF_NAME).

          - **Tessera-Windows.zip**: unzip and run Tessera.exe. Building projects needs the Beef toolchain, the Microsoft C++ Build Tools and Python 3.11+.
          - **Tessera-Linux.zip**: unzip and run ./Tessera. Building projects needs BeefBuild and Python 3.11+ on the PATH.

          See tessera-package.txt in each for details."
          # Checksums, which Tessera Hub checks downloads against.
          (cd out && sha256sum *.zip > SHA256SUMS.txt)
          gh release create "$tag" out/*.zip out/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes "$notes" $pre
